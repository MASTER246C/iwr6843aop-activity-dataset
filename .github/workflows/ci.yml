name: CI
# Documentation checks only; this repository holds no recordings.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Markdown links
        run: python3 -B tools/check_links.py
